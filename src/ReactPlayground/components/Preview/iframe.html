<!-- 
    （沙箱环境）这个 html 文件是 iframe 的页面，用于显示编译后的代码。
    当编译出错时，会通过 window.parent.postMessage 发送消息给父页面，父页面会显示错误信息。
    当编译成功时，会通过 window.parent.postMessage 发送消息给父页面，父页面会显示编译后的代码。
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Preview</title>
</head>
<body>
    <script>
        window.addEventListener('error', (e) => {
            window.parent.postMessage({type: 'ERROR', message: e.message})
        })
    </script>
<script type="importmap"></script>
<script type="module" id="appSrc"></script>
<div id="root"></div>
</body>
</html>
